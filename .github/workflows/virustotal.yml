name: VirusTotal

# A release's installers and portable zips go to VirusTotal, and the links to its reports are written at the end of the release
# notes (between the `<!-- virustotal -->` mark and the end, replaced on a second run). The release workflow calls this after
# publishing; it can also be run by hand for an older tag. It needs the VT_API_KEY secret (a VirusTotal account's API key; the
# free one allows 4 requests a minute); without it nothing happens. Notes edited later must keep that part.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.7"
        type: string
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # The scan also shows on the repository's front page, under "Deployments": an environment named VirusTotal whose link is the
    # report of the Windows installer of the release that was scanned last.
    environment:
      name: VirusTotal
      url: ${{ steps.report.outputs.url }}
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the installers
        if: ${{ env.VT_API_KEY != '' }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir vt --pattern '*Setup.exe' --pattern '*Portable.zip'
      - name: Scan on VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        # v5.0.0, pinned to its commit. Outside a release event it only uploads and gives the links as `analysis`
        # ("path=url,path=url"); the next step writes them into the notes.
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            vt/*
          request_rate: 4
      - name: The report shown under Deployments
        id: report
        if: ${{ env.VT_API_KEY != '' && steps.vt.outputs.analysis != '' }}
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          items = dict(i.split("=", 1) for i in os.environ["ANALYSIS"].split(","))
          pick = next((u for p, u in sorted(items.items()) if p.endswith("win-Setup.exe")), next(iter(items.values())))
          print(f"url={pick}")
          PY
      - name: Add the links to the release notes
        if: ${{ env.VT_API_KEY != '' && steps.vt.outputs.analysis != '' }}
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > body.md
          python3 - <<'PY'
          import os
          body = open("body.md", encoding="utf-8").read()
          body = body.split("<!-- virustotal -->")[0].rstrip()
          rows = []
          for item in sorted(os.environ["ANALYSIS"].split(",")):
              path, url = item.split("=", 1)
              rows.append(f"- [`{os.path.basename(path)}`]({url})")
          section = "<!-- virustotal -->\n\n**VirusTotal scans**\n\n" + "\n".join(rows) + "\n"
          open("notes.md", "w", encoding="utf-8").write((body + "\n\n" if body else "") + section)
          PY
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
