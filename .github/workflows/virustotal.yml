name: VirusTotal

# A release's installers and portable zips go to VirusTotal, and the links to its reports are written at the end of the release
# notes (between the `<!-- virustotal -->` mark and the end, replaced on a second run). The release workflow calls this after
# publishing; it can also be run by hand for an older tag. It needs the VT_API_KEY secret (a VirusTotal account's API key; the
# free one allows 4 requests a minute); without it nothing happens. Notes edited later must keep that part.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.7"
        type: string
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # The scan also shows on the repository's front page, under "Deployments": an environment named VirusTotal whose link is the
    # report of the Windows installer of the release that was scanned last.
    environment:
      name: VirusTotal
      url: ${{ steps.report.outputs.url }}
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the installers
        if: ${{ env.VT_API_KEY != '' }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir vt --pattern '*Setup.exe' --pattern '*Portable.zip'
      - name: Scan on VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        # Each file is looked up by its SHA-256 first: one VirusTotal already has (sent by the release run, or the same bytes as
        # before) gets its existing report, and only unknown files are uploaded. Uploading a file again while its first analysis
        # was pending answered 409 and stopped the whole step, so a second run never reached the Mac zip. The links go out as
        # `analysis` ("path=url,path=url"), as the action used before gave them. The free API allows 4 requests a minute.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, hashlib, json, os, sys, time, urllib.error, urllib.request, uuid
          KEY = os.environ["VT_API_KEY"]
          API = "https://www.virustotal.com/api/v3"
          def call(url, data=None, headers=None):
              time.sleep(16)  # 4 requests a minute
              req = urllib.request.Request(url, data=data, headers={"x-apikey": KEY, **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=600) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
          def upload(path):
              size = os.path.getsize(path)
              url = f"{API}/files"
              if size > 32 << 20:
                  code, j = call(f"{API}/files/upload_url")
                  if code != 200:
                      return code, None
                  url = j["data"]
              b = uuid.uuid4().hex
              head = f'--{b}\r\nContent-Disposition: form-data; name="file"; filename="{os.path.basename(path)}"\r\nContent-Type: application/octet-stream\r\n\r\n'.encode()
              body = head + open(path, "rb").read() + f"\r\n--{b}--\r\n".encode()
              return call(url, body, {"Content-Type": f"multipart/form-data; boundary={b}"})
          links = []
          for path in sorted(glob.glob("vt/*")):
              sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
              code, _ = call(f"{API}/files/{sha}")
              if code == 200:
                  links.append(f"{path}=https://www.virustotal.com/gui/file/{sha}/detection")
                  continue
              code, j = upload(path)
              if code == 200 and j:
                  links.append(f"{path}=https://www.virustotal.com/gui/file-analysis/{j['data']['id']}/detection")
              elif code == 409:
                  links.append(f"{path}=https://www.virustotal.com/gui/file/{sha}/detection")
              else:
                  print(f"{path}: VirusTotal answered {code}", file=sys.stderr)
          print("analysis=" + ",".join(links))
          PY
      - name: The report shown under Deployments
        id: report
        if: ${{ env.VT_API_KEY != '' && steps.vt.outputs.analysis != '' }}
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          items = dict(i.split("=", 1) for i in os.environ["ANALYSIS"].split(","))
          pick = next((u for p, u in sorted(items.items()) if p.endswith("win-Setup.exe")), next(iter(items.values())))
          print(f"url={pick}")
          PY
      - name: Add the links to the release notes
        if: ${{ env.VT_API_KEY != '' && steps.vt.outputs.analysis != '' }}
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > body.md
          python3 - <<'PY'
          import os
          body = open("body.md", encoding="utf-8").read()
          body = body.split("<!-- virustotal -->")[0].rstrip()
          rows = []
          for item in sorted(os.environ["ANALYSIS"].split(",")):
              path, url = item.split("=", 1)
              rows.append(f"- [`{os.path.basename(path)}`]({url})")
          section = "<!-- virustotal -->\n\n**VirusTotal scans**\n\n" + "\n".join(rows) + "\n"
          open("notes.md", "w", encoding="utf-8").write((body + "\n\n" if body else "") + section)
          PY
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
