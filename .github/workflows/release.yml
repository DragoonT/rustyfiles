name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p rf-app
      - name: Package
        shell: pwsh
        run: |
          $name = "rustyfiles-${{ github.ref_name }}-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/rustyfiles.exe, target/release/directlook.exe, scripts/install.ps1, LICENSE, README.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -Append $env:GITHUB_ENV
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ASSET }}" --title "rustyfiles ${{ github.ref_name }}" --generate-notes
