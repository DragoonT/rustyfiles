# The Rust core of rustyfiles for macOS, exposed to the Swift app (macos/) through UniFFI.
# A workspace of its own: the Windows workspace at the repository root leaves it out, so
# Windows builds never compile it. The shared crates are path dependencies.
[workspace]

[package]
name = "rf-mac"
# the app's version comes from the root Cargo.toml ([workspace.package]); see macos/build.sh
version = "0.8.9"
edition = "2024"
license = "MIT"
publish = false
description = "The Rust core of rustyfiles for macOS, exposed to the Swift app through UniFFI"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "rf_mac"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rf-core = { path = "../rf-core" }
rf-archive = { path = "../rf-archive" }
rf-nearby = { path = "../rf-nearby" }
rayon = "1"
thiserror = "2"
anyhow = "1"
uniffi = { version = "0.32", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "aes-crypto"] }

[profile.release]
lto = "thin"
codegen-units = 4
