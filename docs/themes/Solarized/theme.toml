# Solarized (Ethan Schoonover's palette), dark and light, as a rustyfiles theme folder.
# Copy the "Solarized" folder into %APPDATA%\rustyfiles\themes\ and pick it in Settings > Appearance > Theme folder.
# For the colours as they are, choose Settings > Appearance > Background material > Solid.

